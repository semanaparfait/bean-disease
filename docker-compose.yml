# Local scaling setup:  docker compose up -d --build --scale api=3
#   nginx load-balances http://localhost:8000 across all api containers (round robin)
services:
  api:
    build: .
    environment:
      - AUTO_RETRAIN=true
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1500M
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:8000"
    depends_on:
      - api
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      - API_URL=http://lb:8000
    ports:
      - "8501:8501"
    depends_on:
      - lb
