events { worker_connections 1024; }
http {
  client_max_body_size 200m;
  # "api" resolves (at nginx start) to the IP of every api replica -> round-robin load balancing.
  # Restart the lb after changing the number of replicas: docker compose restart lb
  upstream api_backend {
    server api:8000;
  }
  server {
    listen 8000;
    location / {
      proxy_pass http://api_backend;
      proxy_read_timeout 600s;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
